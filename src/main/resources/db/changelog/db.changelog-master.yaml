databaseChangeLog:
  # ============================================================================
  # NOTE: JPA Hibernate auto-creates all tables via ddl-auto: update
  # Liquibase is used ONLY for:
  #   1. Data seeding (roles, default users, etc.)
  #   2. Complex schema updates that require data transformation
  # ============================================================================

  # Seed initial data - roles and default super admin user
  - include:
      file: db/changelog/migrations/seed-001-initial-data.xml

  # Add form_code and event_code columns for form categorization
  - include:
      file: db/changelog/migrations/add-form-codes-001.xml

  # Add constraint for form_code and event_code mutual exclusion
  - include:
      file: db/changelog/migrations/add-form-code-constraint-002.xml

  # Seed ministry form records (Power Bible School, ADMA, Discipleship, Coordinators, Join Campus)
  - include:
      file: db/changelog/migrations/seed-ministry-forms-003.xml

  # Expand donations offering_type check constraint to include MISSION_OFFERING and MEDIA_OFFERING
  - include:
      file: db/changelog/migrations/update-donations-offering-type-constraint-004.xml

  # Expand donations offering_type check constraint to include ADOMA, Discipleship and PBS honour offerings
  - include:
      file: db/changelog/migrations/update-donations-offering-type-constraint-005.xml

  # Enable payment on Abel Damina Mentoring Academy form (USD/Stripe; NGN via bank transfer)
  - include:
      file: db/changelog/migrations/seed-adoma-payment-006.xml

  # Enable payment on Power Bible School form (USD/Stripe; NGN via bank transfer). Online $300/₦300k, On-site $100/₦100k
  - include:
      file: db/changelog/migrations/seed-pbs-payment-007.xml

  # Make users.last_name nullable (single display name support)
  - include:
      file: db/changelog/migrations/alter-users-last-name-nullable-008.xml

  # Create role_permissions table and seed admin/coordinator permissions
  - include:
      file: db/changelog/migrations/seed-role-permissions-009.xml

  # Migrate roles from database enum to string-backed roles
  - include:
      file: db/changelog/migrations/migrate-roles-to-string-010.xml

  # Seed super admin permissions and fix permission columns
  - include:
      file: db/changelog/migrations/seed-super-admin-permissions-011.xml

  # Add created_by_admin column to users
  - include:
      file: db/changelog/migrations/add-created-by-admin-012.xml

  # Add archived flag to form submissions (archive abandoned Stripe submissions)
  - include:
      file: db/changelog/migrations/add-archived-form-submissions-013.xml

  # Seed EVENTS form permission
  - include:
      file: db/changelog/migrations/seed-events-permission-014.xml

  # Seed monthly report form template
  - include:
      file: db/changelog/migrations/seed-monthly-report-form-015.xml

  # Update monthly report form fields
  - include:
      file: db/changelog/migrations/update-monthly-report-form-016.xml

  # Drop redundant report tables
  - include:
      file: db/changelog/migrations/drop-redundant-report-tables-017.xml

  # Rename user names columns to full_name
  - include:
      file: db/changelog/migrations/rename-user-names-to-fullname-018.xml

  # Relax course category constraints
  - include:
      file: db/changelog/migrations/relax-course-category-019.xml

  # Drop course category check constraint
  - include:
      file: db/changelog/migrations/drop-course-category-check-020.xml

  # Drop lesson duration check constraint
  - include:
      file: db/changelog/migrations/drop-lesson-duration-check-021.xml
