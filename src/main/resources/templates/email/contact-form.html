<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Contact Form Message</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; line-height: 1.6; color: #1a1a1a; margin: 0; padding: 0; background: #f5f5f5; }
        .container { max-width: 560px; margin: 0 auto; padding: 32px 24px; }
        .logo { max-width: 140px; height: auto; margin-bottom: 24px; }
        table { border-collapse: collapse; width: 100%; margin: 16px 0; }
        td { padding: 8px 0; border-bottom: 1px solid #e5e7eb; font-size: 14px; vertical-align: top; }
        td:first-child { color: #6b7280; width: 30%; }
        .message { white-space: pre-wrap; border: 1px solid #e5e7eb; border-radius: 6px; padding: 16px; font-size: 14px; }
        .footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <img th:src="'cid:logo'" alt="Power City International" class="logo" />

    <p>A new message was submitted from the ADMI / Power City website.</p>

    <table>
        <tr>
            <td>Name</td>
            <td th:text="${name}">—</td>
        </tr>
        <tr>
            <td>Email</td>
            <td><a th:href="'mailto:' + ${senderEmail}" th:text="${senderEmail}">—</a></td>
        </tr>
        <tr>
            <td>Subject</td>
            <td th:text="${subject}">—</td>
        </tr>
    </table>

    <p><strong>Message</strong></p>
    <div class="message" th:text="${message}">—</div>

    <p>Reply directly to this email to respond to <span th:text="${name}">the sender</span>
        at <a th:href="'mailto:' + ${senderEmail}" th:text="${senderEmail}">their email</a>.</p>

    <div class="footer">
        <p>&copy; <span th:text="${currentYear}">2026</span> ADMI / Power City International</p>
        <p><a href="https://admi.drabeldamina.org/">admi.drabeldamina.org</a></p>
    </div>
</div>
</body>
</html>
