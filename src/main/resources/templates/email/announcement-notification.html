<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Announcement</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; line-height: 1.6; color: #1a1a1a; margin: 0; padding: 0; background: #f5f5f5; }
        .container { max-width: 560px; margin: 0 auto; padding: 32px 24px; }
        .logo { max-width: 140px; height: auto; margin-bottom: 24px; }
        .badge { display: inline-block; background: #155DFC; color: #ffffff; padding: 4px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-bottom: 16px; }
        .card { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; margin: 20px 0; }
        h1 { font-size: 20px; color: #0A0A0A; margin: 0 0 12px 0; }
        .message { font-size: 15px; color: #4A5565; white-space: pre-wrap; margin: 0 0 20px 0; }
        .meta { font-size: 13px; color: #6b7280; margin-top: 16px; border-top: 1px solid #f0f0f2; padding-top: 12px; }
        .button { display: inline-block; background: #155DFC; color: #ffffff; padding: 12px 28px; text-decoration: none; border-radius: 6px; margin: 8px 0; }
        .footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <img th:src="'cid:logo'" alt="Abel Damina Ministries International" class="logo" />

    <span class="badge" style="display:inline-block;background:#155DFC;color:#ffffff;padding:4px 14px;border-radius:999px;font-size:12px;font-weight:600;margin-bottom:16px;">NEW ANNOUNCEMENT</span>

    <p>Hello <span th:text="${firstName}">there</span>,</p>

    <div class="card" style="background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;margin:20px 0;">
        <h1 th:text="${announcementTitle}" style="font-size:20px;color:#0A0A0A;margin:0 0 12px 0;">Announcement Title</h1>
        <p class="message" th:text="${announcementBody}" style="font-size:15px;color:#4A5565;white-space:pre-wrap;margin:0 0 20px 0;">Announcement message</p>
        <p class="meta" style="font-size:13px;color:#6b7280;margin-top:16px;border-top:1px solid #f0f0f2;padding-top:12px;">
            Sent by <span th:text="${senderName}">National Leader</span>
        </p>
    </div>

    <p><a th:href="${portalLink}" class="button" style="display:inline-block;background:#155DFC;color:#ffffff;text-decoration:none;padding:12px 28px;border-radius:6px;">View in Portal</a></p>

    <p>Blessings,<br>Abel Damina Ministries International</p>

    <div class="footer">
        <p>&copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> Abel Damina Ministries International</p>
    </div>
</div>
</body>
</html>
