<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Enrollment Confirmation - Power City International</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; line-height: 1.6; color: #1a1a1a; margin: 0; padding: 0; background: #f5f5f5; }
        .container { max-width: 560px; margin: 0 auto; padding: 32px 24px; }
        .logo { max-width: 140px; height: auto; margin-bottom: 24px; }
        table { border-collapse: collapse; width: 100%; margin: 16px 0; }
        td { padding: 8px 0; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
        td:first-child { color: #6b7280; width: 40%; }
        .footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <img th:src="'cid:logo'" alt="Power City International" class="logo" />

    <p>Hello <span th:text="${firstName}">there</span>,</p>

    <p>You've successfully enrolled in <strong th:text="${courseName}">Course Name</strong> at Power City International.</p>

    <table>
        <tr>
            <td>Course</td>
            <td th:text="${courseName}">Course Name</td>
        </tr>
        <tr>
            <td>Enrollment Date</td>
            <td th:text="${#dates.format(#dates.createNow(), 'EEEE, MMMM d, yyyy')}">Today</td>
        </tr>
    </table>

    <p>For support, email us at <a href="mailto:it@drabeldamina.org">it@drabeldamina.org</a>.</p>

    <p>Blessings,<br>ADMI Team</p>

    <div class="footer">
        <p>&copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> Power City International</p>
        <p th:if="${region}">Region: <span th:text="${region}">UK</span></p>
        <p>This email was sent to <span th:text="${email}">user@example.com</span></p>
    </div>
</div>
</body>
</html>
